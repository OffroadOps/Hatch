[package]
name = "npga-rust"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "NPGA native Rust desktop client"

[lib]
name = "npga"
path = "src/lib.rs"

[[bin]]
name = "NPGA-Rust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
ipnet = "2.11"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Networking_WinInet", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
# `panic = "abort"` is deliberately NOT set: the runtime restores the Windows
# system proxy, kills the managed core process tree and removes the temporary
# core configs from `Drop` impls. Aborting on panic would skip all of that
# and leave a stale system proxy plus orphaned xray/sing-box processes behind.
panic = "unwind"

