name: Hatch Release CI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Setup .NET 8.0.100
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.100
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache-dependency-path: Other/aiodns/go.sum

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MinGW for aiodns
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build, test, and package
        shell: pwsh
        run: .\build.ps1 -Configuration Release -OutputPath release

      - name: Generate updater-compatible release notes
        shell: pwsh
        run: |
          $assets = Get-ChildItem release -File | Where-Object Name -In @('Hatch.zip', 'HatchSetup.exe')
          $lines = @(
            "# Hatch $env:GITHUB_REF_NAME"
            ''
            'See CHANGELOG.md for the complete release notes.'
            ''
            'The current binaries are unsigned. Verify the SHA256 values below before running them.'
            ''
            '## 校验和 | Checksums'
            ''
            '| 文件名 | SHA256 |'
            '| :- | :- |'
          )
          foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "| $($asset.Name) | $hash |"
          }
          $lines | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/Hatch.zip
            release/HatchSetup.exe
            release/SHA256SUMS.txt
