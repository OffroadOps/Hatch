name: NPGA Release CI

# A tagged release publishes the Rust client (mainline) only. The runtime
# bundle is assembled from the pinned cores in build.dependencies.json plus
# the shared assets tracked in Storage/ (Tools/AssembleRuntime.ps1). The frozen
# C# build chain moved to an external archive (refactor/DECISIONS.md ADR-007);
# it is no longer part of the release path, and NPGA.zip / NPGASetup.exe
# remain only in historical releases.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-package:
    name: Rust client package (mainline)
    runs-on: windows-2022
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            npga-rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('npga-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Assemble runtime bundle
        shell: pwsh
        run: ./Tools/AssembleRuntime.ps1 -RuntimeRoot .release-runtime

      - name: Build Rust package (runs tests, clippy, fmt)
        shell: pwsh
        run: >-
          .\build-rust.ps1
          -RuntimePath .release-runtime
          -OutputPath release-rust

      - name: Upload Rust package
        uses: actions/upload-artifact@v7
        with:
          name: npga-rust-artifacts
          path: |
            release-rust/NPGA-Rust.zip
            release-rust/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [rust-package]
    runs-on: windows-2022
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Generate updater-compatible release notes
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts -Recurse -File | Where-Object Name -In @('NPGA-Rust.zip')
          $lines = @(
            "# NPGA $env:GITHUB_REF_NAME"
            ''
            'See CHANGELOG.md for the complete release notes.'
            ''
            'The current binaries are unsigned. Verify the SHA256 values below before running them.'
            ''
            '## 校验和 | Checksums'
            ''
            '| 文件名 | SHA256 |'
            '| :- | :- |'
          )
          foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "| $($asset.Name) | $hash |"
          }
          $lines | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/npga-rust-artifacts/NPGA-Rust.zip
