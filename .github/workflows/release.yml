name: Hatch Release CI
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.0)'
        required: true
        default: '2.0.0'

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_NETCH_SHA256=$(.\sha256.ps1 .\Netch)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_OTHER_SHA256=$(.\sha256.ps1 .\Other)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\sha256.ps1 .\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\sha256.ps1 .\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Netch
        uses: actions/cache@v4
        with:
          key: Hatch-${{ runner.os }}-Netch-${{ env.SOURCE_NETCH_SHA256 }}
          path: |
            .\Netch\bin

      - name: Cache Redirector
        uses: actions/cache@v4
        with:
          key: Hatch-${{ runner.os }}-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v4
        with:
          key: Hatch-${{ runner.os }}-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v3
        with:
          files: .\Other\release\aiodns.bin

      - name: Setup Go
        uses: actions/setup-go@v5
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: '1.22'

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          toolchain: nightly
          profile: minimal

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: |
          Write-Host "Starting build process..."
          Write-Host "Current directory: $(Get-Location)"
          Write-Host ".NET version:"
          dotnet --version
          
          Write-Host "`nMSBuild version:"
          msbuild -version
          
          Write-Host "`nVisual Studio installations:"
          vswhere -all -products * -property installationPath
          
          Write-Host "`nRunning build.ps1 (skipping C++ build, using cached binaries)..."
          .\build.ps1 -Configuration Release -OutputPath release -SkipCppBuild $true
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          Write-Host "`nBuild completed successfully!"
          Write-Host "Release folder contents:"
          Get-ChildItem -Path release -Recurse -Name

      - name: Package 7z
        shell: pwsh
        run: |
          Write-Host "Creating 7z archive..."
          7z a -mx9 Hatch.7z release
          7z rn Hatch.7z release Hatch
          Write-Host "7z archive created: $(Get-Item Hatch.7z | Select-Object -ExpandProperty Length) bytes"

      - name: Package Zip
        shell: pwsh
        run: |
          Write-Host "Creating zip archive..."
          Compress-Archive -Path release\* -DestinationPath Hatch-temp.zip -CompressionLevel Optimal
          
          # Create proper structure with Hatch folder
          New-Item -ItemType Directory -Path "Hatch" -Force | Out-Null
          Move-Item -Path release\* -Destination Hatch\ -Force
          Compress-Archive -Path Hatch -DestinationPath Hatch.zip -CompressionLevel Optimal
          Write-Host "Zip archive created: $(Get-Item Hatch.zip | Select-Object -ExpandProperty Length) bytes"
          
      - name: Checksum
        shell: pwsh
        run: |
          $hash7z=(Get-FileHash Hatch.7z -Algorithm SHA256).Hash.ToLower()
          $hashZip=(Get-FileHash Hatch.zip -Algorithm SHA256).Hash.ToLower()
          echo "HATCH_7Z_SHA256=$hash7z" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "HATCH_ZIP_SHA256=$hashZip" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          draft: false
          files: |
            Hatch.7z
            Hatch.zip
          body: |
            # Hatch v${{ github.ref_name }}
            
            基于 Netch 1.9.7 继续开发的分支版本 | A fork based on Netch 1.9.7
            
            ## 📦 下载 | Downloads
            
            - **Hatch.7z** - 7-Zip 压缩包 (推荐，体积更小)
            - **Hatch.zip** - ZIP 压缩包 (兼容性更好)
            
            ## ✨ 更新日志 | Changelogs
            
            * 这是 GitHub Actions 自动化部署
            * 基于 Netch 1.9.7 项目继续开发
            * 集成 Xray-core 最新版本
            * 优化构建体积 (减少 56.8%)
            * 改进 UI 界面和延迟显示
            * Hysteria2 协议优化
            
            ## 🔐 校验和 | Checksums
            
            | 文件名 | SHA256 |
            | :- | :- |
            | Hatch.7z | ${{ env.HATCH_7Z_SHA256 }} |
            | Hatch.zip | ${{ env.HATCH_ZIP_SHA256 }} |
            
            ## 📖 使用说明 | Documentation
            
            请查看 [README.md](https://github.com/OffroadOps/Hatch/blob/main/README.md) 获取详细使用说明。
            
            ---
            
            **注意**: 本工具仅供学习和研究使用，使用者需遵守当地法律法规。
