name: NPGA CI

# Mainline: the Rust client (npga-rust) is the only product tree in this
# repository (refactor/DECISIONS.md ADR-001). The frozen C# build chain moved
# to an external archive (ADR-007); the release runtime bundle is now
# assembled from the pinned cores in build.dependencies.json plus the shared
# assets tracked in Storage/ (Tools/AssembleRuntime.ps1).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust client (npga-rust)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            npga-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('npga-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Fetch version-pinned proxy cores
        shell: pwsh
        run: ./Tools/FetchPinnedCores.ps1 -RuntimeRoot .ci-runtime

      - name: Format check
        working-directory: npga-rust
        run: cargo fmt --check

      - name: Lint (clippy, warnings as errors)
        working-directory: npga-rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (unit, migration, and real-core integration)
        working-directory: npga-rust
        env:
          NPGA_RUNTIME_ROOT: ${{ github.workspace }}/.ci-runtime
        run: cargo test --locked -- --include-ignored --test-threads=1

      - name: Release build
        working-directory: npga-rust
        run: cargo build --release --locked

      - name: Upload client binary
        uses: actions/upload-artifact@v7
        with:
          name: NPGA-Rust-${{ github.sha }}
          path: npga-rust/target/release/NPGA-Rust.exe
          if-no-files-found: error

  package:
    name: Runtime bundle and portable package (smoke)
    runs-on: windows-2022
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            npga-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('npga-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Assemble runtime bundle
        shell: pwsh
        run: ./Tools/AssembleRuntime.ps1 -RuntimeRoot .release-runtime

      - name: Build portable package (tests already ran in the rust job)
        shell: pwsh
        run: .\build-rust.ps1 -RuntimePath .release-runtime -OutputPath release-rust -SkipTests

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: NPGA-Rust-package-${{ github.sha }}
          path: |
            release-rust/NPGA-Rust.zip
            release-rust/SHA256SUMS.txt
          if-no-files-found: error
