name: Hatch Build CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8.0.100
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.100
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache-dependency-path: Other/aiodns/go.sum

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MinGW for aiodns
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Configuration Release -OutputPath release -SkipInstaller

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: Hatch-${{ github.sha }}
          path: |
            release/Hatch.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
